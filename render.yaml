services:
  - type: web
    name: wedding-pix
    env: node
    buildCommand: npm install
    startCommand: npx tsx api-server.ts
    plan: starter
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: wedding-data
      mountPath: /opt/render/project/src
      sizeGB: 1
