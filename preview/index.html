<body>
  <div id="app"></div>
  <script>
    // API_BASE: deploy tool rewrites __PORT_3000__ to proxy path
    var PLACEHOLDER = "__PORT_3000__";
    var API_BASE = PLACEHOLDER.startsWith("__") ? "" : PLACEHOLDER;

    function isVideo(mimeType) {
      return mimeType && mimeType.startsWith("video/");
    }

    function formatTime(iso) {
      var d = new Date(iso);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // Shared back button SVG icons
    var BACK_ARROW_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';
    var DOWNLOAD_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    var TRASH_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
    var CHECK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';

    // ===== Router =====
    function router() {
      var hash = window.location.hash.slice(1) || '/';
      var parts = hash.split('/');
      var page = parts[1] || '';
      var app = document.getElementById('app');
      
      if (page === 'upload') {
        renderUpload(app);
      } else if (page === 'gallery') {
        renderGallery(app);
      } else if (page === 'slideshow') {
        renderSlideshow(app);
      } else if (page === 'admin') {
        renderAdmin(app);
      } else {
        renderHome(app);
      }
    }

    // ===== Home Page =====
    function renderHome(el) {
      var uploadUrl = window.location.origin + window.location.pathname + '#/upload';
      el.innerHTML = '\
        <main class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-amber-50 flex flex-col">\
          <div class="botanical-header"></div>\
          <div class="flex-1 flex items-center justify-center p-6">\
            <div class="max-w-2xl w-full text-center">\
            <div class="mb-12">\
              <p class="text-sm uppercase tracking-wide text-rose-400 mb-3">Together with Love</p>\
              <h1 class="font-serif text-5xl md:text-6xl text-stone-800 mb-2">Jessalynn & Dylan</h1>\
              <p class="text-sm text-stone-500 mb-4">September 27, 2026 · Leach Botanical Garden</p>\
              <div style="width:4rem;height:1px;background:#5C6B3D;margin:0 auto 1.5rem;"></div>\
              <p class="text-stone-600 text-lg leading-relaxed">Help us capture every angle of our special day. Upload your photos and videos — they will appear in our live gallery instantly.</p>\
            </div>\
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-12">\
              <a href="#/upload" class="group bg-white rounded-2xl p-8 shadow-sm border border-stone-100 hover:shadow-md hover:border-rose-200 transition-all">\
                <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-rose-50 flex items-center justify-center group-hover:bg-rose-100 transition-all">\
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#722F37" stroke-width="2"><path d="M12 2C8 6 6 10 6 14a6 6 0 0 0 12 0c0-4-2-8-6-12z"/><path d="M12 22V8"/></svg>\
                </div>\
                <h2 class="font-serif text-xl text-stone-800 mb-1">Upload Photos</h2>\
                <p class="text-sm text-stone-500">Share your snaps and clips</p>\
              </a>\
              <a href="#/gallery" class="group bg-white rounded-2xl p-8 shadow-sm border border-stone-100 hover:shadow-md hover:border-rose-200 transition-all">\
                <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-amber-50 flex items-center justify-center group-hover:bg-amber-100 transition-all">\
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5C6B3D" stroke-width="2"><path d="M12 2C8 6 6 10 6 14a6 6 0 0 0 12 0c0-4-2-8-6-12z"/><path d="M12 22V8"/></svg>\
                </div>\
                <h2 class="font-serif text-xl text-stone-800 mb-1">View Gallery</h2>\
                <p class="text-sm text-stone-500">Browse everyone\'s photos</p>\
              </a>\
              <a href="#/slideshow" class="group bg-white rounded-2xl p-8 shadow-sm border border-stone-100 hover:shadow-md hover:border-rose-200 transition-all">\
                <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-violet-50 flex items-center justify-center group-hover:bg-violet-100 transition-all">\
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#722F37" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>\
                </div>\
                <h2 class="font-serif text-xl text-stone-800 mb-1">Live Slideshow</h2>\
                <p class="text-sm text-stone-500">Auto-playing photo wall</p>\
              </a>\
            </div>\
            <div class="bg-white rounded-2xl p-8 shadow-sm border border-stone-100">\
              <h2 class="font-serif text-2xl text-stone-800 mb-6">QR Code for Guests</h2>\
              <div id="qr-container">\
                <button onclick="generateQR()" class="px-6 py-3 bg-rose-500 text-white rounded-full font-medium hover:bg-rose-600 transition-all">Show QR Code</button>\
              </div>\
            </div>\
            <p class="text-sm uppercase tracking-wide mt-12" style="color:#5C6B3D;">Cheers to Forever</p>\
            <p class="text-sm font-semibold text-stone-600 mt-2" style="text-shadow: 0 1px 2px rgba(0,0,0,0.1);">Made with love for our wedding day by Lampredi 🚀</p>\
          </div>\
          </div>\
          <div class="botanical-footer"></div>\
        </main>';

      window._uploadUrl = uploadUrl;
    }

    function generateQR() {
      var container = document.getElementById('qr-container');
      var url = window._uploadUrl || (window.location.origin + window.location.pathname + '#/upload');
      
      var script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';
      script.onload = function() {
        var qr = qrcode(0, 'H');
        qr.addData(url);
        qr.make();
        var svg = qr.createSvgTag({ cellSize: 3, margin: 4 });
        container.innerHTML = '<div class="flex flex-col items-center gap-4">' +
          '<div class="bg-white p-6 rounded-xl border-2 border-stone-100">' + svg + '</div>' +
          '<p class="text-xs text-stone-400 break-all" style="max-width:20rem;">' + url + '</p>' +
          '</div>';
      };
      document.head.appendChild(script);
    }

    // ===== Upload Page =====
    function renderUpload(el) {
      el.innerHTML = '\

          <div class="max-w-2xl mx-auto">\

              <h1 class="font-serif text-4xl text-stone-800 mt-6 mb-2">Upload Your Photos</h1>\
              <div style="width:3rem;height:1px;background:#5C6B3D;margin:0 auto 1rem;"></div>\
              <p class="text-stone-600">Drag and drop or tap to select — photos and videos welcome</p>\
            </div>\
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-stone-100 mb-4">\
              <div class="grid grid-cols-1 gap-4">\
                <div>\
                  <label class="block text-sm font-medium text-stone-700 mb-2">Your Name</label>\
                  <input type="text" id="guestName" placeholder="e.g. Aunt Jane" class="w-full px-4 py-2.5 rounded-lg border border-stone-200 focus:border-rose-300 outline-none transition-all text-stone-800" />\
                </div>\
                <div>\
                  <label class="block text-sm font-medium text-stone-700 mb-2">Caption (optional)</label>\
                  <input type="text" id="caption" placeholder="e.g. First dance!" class="w-full px-4 py-2.5 rounded-lg border border-stone-200 focus:border-rose-300 outline-none transition-all text-stone-800" />\
                </div>\
              </div>\
            </div>\
            <div id="dropzone" class="bg-white rounded-2xl p-8 shadow-sm border-2 border-dashed border-stone-200 hover:border-rose-300 transition-all text-center">\
              <div class="flex flex-col items-center gap-4">\
                <div class="w-16 h-16 rounded-full bg-rose-50 flex items-center justify-center">\
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#722F37" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>\
                </div>\
                <p class="font-serif text-xl text-stone-800">Add Your Photos & Videos</p>\
                <div class="flex flex-col sm:flex-row gap-3 w-full max-w-md">\
                  <button type="button" id="btn-library" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-3 bg-rose-500 text-white rounded-full font-medium hover:bg-rose-600 transition-all text-sm">\
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>\

    async function handleFiles(files) {
      if (!files || files.length === 0) return;
      var statusEl = document.getElementById('uploadStatus');
      var dropzone = document.getElementById('dropzone');
      dropzone.style.opacity = '0.6';
      dropzone.style.pointerEvents = 'none';
      
      var successCount = 0;
      var lastError = '';

      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        
        // Client-side file size check
        if (file.size > 100 * 1024 * 1024) {
          lastError = file.name + ' is too large (max 100MB). Please choose a smaller file.';
          continue;
        }
        
        statusEl.innerHTML = '<div class="mt-4 bg-rose-50 border border-rose-100 rounded-xl p-4 flex items-center gap-3">\
          <div class="w-8 h-8 rounded-full border-3 border-rose-200 border-t-rose-500 animate-spin"></div>\
          <p class="text-stone-600 font-medium">Uploading ' + (i + 1) + ' of ' + files.length + '...</p>\
        </div>';

        var formData = new FormData();
        formData.append('file', file);
        formData.append('caption', document.getElementById('caption').value || '');
        formData.append('guestName', document.getElementById('guestName').value || '');

        try {
          var res = await fetch(API_BASE + '/api/upload', { method: 'POST', body: formData });
          if (res.ok) {
            successCount++;
          } else {
            var data = await res.json();
            lastError = data.error || 'Upload failed';
          }
        } catch(e) {
          lastError = 'Network error — please try again';
        }
      }

      dropzone.style.opacity = '1';
      dropzone.style.pointerEvents = 'auto';

      if (successCount > 0) {
        statusEl.innerHTML = '<div class="mt-4 bg-green-50 border border-green-100 rounded-xl p-4 flex flex-col items-center gap-3">\
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>\
          <p class="font-serif text-xl text-stone-800">' + successCount + (successCount === 1 ? ' photo' : ' photos') + ' uploaded!</p>\
          <p class="text-sm text-stone-500">Thank you for sharing. Upload more or view the gallery.</p>\
          <div class="flex gap-3 mt-2">\
            <button onclick="document.getElementById(\'fileInput\').value=\'\';document.getElementById(\'fileInputPhoto\').value=\'\';document.getElementById(\'fileInputVideo\').value=\'\';document.getElementById(\'uploadStatus\').innerHTML=\'\';" class="px-5 py-2.5 bg-rose-500 text-white rounded-full font-medium hover:bg-rose-600 transition-all text-sm">Upload More</button>\
            <a href="#/gallery" class="px-5 py-2.5 bg-white text-stone-700 rounded-full font-medium border border-stone-200 hover:border-stone-300 transition-all text-sm inline-flex items-center">View Gallery</a>\
          </div>\
        </div>';
      } else {
        statusEl.innerHTML = '<div class="mt-4 bg-red-50 border border-red-100 rounded-xl p-4 flex items-center gap-3">\
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>\
          <p class="text-sm text-red-700">' + lastError + '</p>\
        </div>';
      }
    }

    function updateDownloadSelectedBtn() {

      if (btn && text) {

          // Show total size after 2nd item selected
          if (count >= 2) {
            var totalBytes = 0;
            var media = galleryState.media;
            for (var i = 0; i < media.length; i++) {
              if (galleryState.selected[media[i].id] && media[i].size) {

    async function downloadSingle(id) {
      var media = window._galleryMedia || [];
      var item = media.find(function(m) { return m.id === id; });
      if (!item) return;
      
      var src = API_BASE + '/uploads/' + item.filename;
      var filename = item.originalName || item.filename;
      // Preserve file extension
      var ext = item.mimeType && item.mimeType.split('/')[1];
      if (ext && !filename.includes('.')) filename = filename + '.' + ext;
      
      // Show loading state on the download button in lightbox
      var dlBtn = document.querySelector('#lightbox-buttons button');
      var originalHTML = '';
      if (dlBtn && dlBtn.textContent.includes('Download')) {
        originalHTML = dlBtn.innerHTML;
        dlBtn.innerHTML = '<div class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></div> <span>Downloading...</span>';
        dlBtn.style.pointerEvents = 'none';
      }
      
      try {
        var res = await fetch(src);
        var blob = await res.blob();
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      } catch(e) {
        // Fallback: open in new tab
        window.open(src, '_blank');
      } finally {
        if (dlBtn && originalHTML) {
          dlBtn.innerHTML = originalHTML;
          dlBtn.style.pointerEvents = 'auto';
        }
      }
    }

    async function downloadSelected() {
      var ids = Object.keys(galleryState.selected);
      if (ids.length === 0) return;
      
      var btn = document.getElementById('download-selected-btn');
      var originalHTML = btn ? btn.innerHTML : '';
      if (btn) {
        btn.innerHTML = '<div class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></div> <span>Zipping...</span>';
        btn.style.pointerEvents = 'none';
      }
      
      try {
        // Load JSZip if not already loaded
        if (typeof JSZip === 'undefined') {
          await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
        }
        
        var zip = new JSZip();
        var media = galleryState.media;
        var added = 0;
        
        for (var i = 0; i < ids.length; i++) {
          var item = media.find(function(m) { return m.id === ids[i]; });
          if (!item) continue;
          
          var src = API_BASE + '/uploads/' + item.filename;
          var filename = item.originalName || item.filename;
          var ext = item.mimeType && item.mimeType.split('/')[1];
          if (ext && !filename.includes('.')) filename = filename + '.' + ext;
          
          // Avoid duplicate filenames
          if (zip.file(filename)) {
            var baseName = filename.replace(/\.[^.]+$/, '');
            var extension = filename.match(/\.[^.]+$/);
            filename = baseName + '_' + ids[i].substring(0, 4) + (extension ? extension[0] : '');
          }
          
          if (btn) {
            btn.innerHTML = '<div class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></div> <span>Downloading ' + (i + 1) + '/' + ids.length + '...</span>';
          }
          
          try {
            var res = await fetch(src);
            var blob = await res.blob();
            zip.file(filename, blob);
            added++;
          } catch(e) {
            console.error('Failed to fetch', filename, e);
          }
        }
        
        if (added > 0) {
          if (btn) {
            btn.innerHTML = '<div class="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></div> <span>Creating ZIP...</span>';
          }
          var zipBlob = await zip.generateAsync({ type: 'blob' });
          var url = URL.createObjectURL(zipBlob);
          var a = document.createElement('a');
          a.href = url;
          a.download = 'wedding-photos-' + new Date().toISOString().split('T')[0] + '.zip';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
        }
      } catch(e) {
        console.error('ZIP download failed:', e);
        alert('Could not create ZIP file. Try downloading photos individually.');
      } finally {
        if (btn) {
          btn.innerHTML = originalHTML;
          btn.style.pointerEvents = 'auto';
        }
      }
    }

    function loadScript(src) {

        s.onload = resolve;

      });

    function openLightbox(id) {
      var media = window._galleryMedia || [];
      var item = media.find(function(m) { return m.id === id; });
      if (!item) return;
      
      // Track current index for swipe navigation
      var currentIndex = media.findIndex(function(m) { return m.id === id; });
      if (currentIndex < 0) currentIndex = 0;
      window._lightboxMedia = media;
      window._lightboxIndex = currentIndex;
      
      renderLightbox();
    }
    
    function renderLightbox() {
      var media = window._lightboxMedia || [];
      var idx = window._lightboxIndex || 0;
      var item = media[idx];
      if (!item) return;
      
      var src = API_BASE + '/uploads/' + item.filename;
      var filename = item.originalName || item.filename;
      var ext = item.mimeType && item.mimeType.split('/')[1];
      if (ext && !filename.includes('.')) filename = filename + '.' + ext;
      
      var mediaEl = isVideo(item.mimeType)
        ? '<video src="' + src + '" controls autoplay playsinline preload="metadata" class="rounded-lg" style="max-width:100%; max-height:85vh; width:auto; height:auto; object-fit:contain;"></video>'
        : '<img src="' + src + '" alt="' + (item.caption || 'Wedding photo') + '" class="rounded-lg" style="max-width:100%; max-height:85vh; width:auto; height:auto; object-fit:contain;" />';
      
      // Remove existing overlay
      var existing = document.getElementById('lightbox-overlay');
      if (existing) document.body.removeChild(existing);
      
      var overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop';
      overlay.id = 'lightbox-overlay';
      overlay.onclick = function(e) {
        // Skip double-tap detection when clicking on video controls
        if (e.target && (e.target.tagName === 'VIDEO' || e.target.closest('video'))) return;
        // Double-tap anywhere to close; single tap does nothing
        if (window._lightboxLastTap && Date.now() - window._lightboxLastTap < 350) {
          window._lightboxLastTap = 0;
          closeLightbox();
        } else {
          window._lightboxLastTap = Date.now();
        }
      };
      
      // Navigation arrows (hidden on mobile, swipe instead)
      var prevArrow = media.length > 1 ? '<button class="hidden md:flex absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white items-center justify-center transition-all" onclick="navigateLightbox(-1)">‹</button>' : '';
      var nextArrow = media.length > 1 ? '<button class="hidden md:flex absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white items-center justify-center transition-all" onclick="navigateLightbox(1)">›</button>' : '';
      
      overlay.innerHTML = '<div class="relative w-full flex flex-col items-center">' +
        prevArrow +
        nextArrow +
        '<div class="flex items-center justify-center w-full">' + mediaEl + '</div>' +
        (item.caption ? '<p class="text-white text-center mt-3 font-serif text-lg">' + item.caption + '</p>' : '') +
        (item.guestName ? '<p class="text-white/50 text-sm mt-1">— ' + item.guestName + '</p>' : '') +
        (media.length > 1 ? '<p class="text-white/30 text-xs mt-1">' + (idx + 1) + ' of ' + media.length + '</p>' : '') +
        '</div>' +
        // Fixed button bar at bottom — always visible, clears iOS home bar
        '<div class="fixed bottom-0 left-0 right-0 z-50 flex items-center justify-center gap-3 p-4 pb-8" id="lightbox-buttons">' +
          '<button class="inline-flex items-center gap-2 px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-full border border-white/20 text-sm text-white font-medium transition-all" style="text-shadow: -1px -1px 0 #5C6B3D, 1px -1px 0 #5C6B3D, -1px 1px 0 #5C6B3D, 1px 1px 0 #5C6B3D, 0 0 3px #5C6B3D;" onclick="downloadSingle(\'' + item.id + '\')">' + DOWNLOAD_SVG + ' Download</button>' +
          '<button class="inline-flex items-center gap-2 px-5 py-2.5 bg-red-500 hover:bg-red-600 rounded-full border border-red-600 text-sm text-black font-medium transition-all" onclick="closeLightbox();deleteSingle(\'' + item.id + '\')">' + TRASH_SVG + ' Delete</button>' +
          '<button class="inline-flex items-center gap-2 px-5 py-2.5 bg-white/10 hover:bg-white/20 rounded-full border border-white/20 text-sm text-white font-medium transition-all" style="text-shadow: -1px -1px 0 #5C6B3D, 1px -1px 0 #5C6B3D, -1px 1px 0 #5C6B3D, 1px 1px 0 #5C6B3D, 0 0 3px #5C6B3D;" onclick="closeLightbox()">✕ Close</button>' +
        '</div>';
      document.body.appendChild(overlay);
      
      // iOS Safari: call play() explicitly after user gesture
      var lightboxVideo = overlay.querySelector('video');
      if (lightboxVideo) {
        lightboxVideo.play().catch(function() {
          // Autoplay blocked — user can press play manually since controls are visible
        });
      }
      
      // Touch swipe navigation
      var touchStartX = 0;
      var touchEndX = 0;
      overlay.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      overlay.addEventListener('touchend', function(e) {
        touchEndX = e.changedTouches[0].screenX;
        var swipeDistance = touchEndX - touchStartX;
        // Swipe left (negative) = next, swipe right (positive) = previous
        if (Math.abs(swipeDistance) > 30) {
          if (swipeDistance < 0) {
            navigateLightbox(1);  // Swipe left → next
          } else {
            navigateLightbox(-1); // Swipe right → previous
          }
        }
      }, { passive: true });
      
      // Esc key + arrow keys
      document.onkeydown = function(e) {
        if (e.key === 'Escape') {
          closeLightbox();
        } else if (e.key === 'ArrowLeft') {
          navigateLightbox(-1);
        } else if (e.key === 'ArrowRight') {
          navigateLightbox(1);
        }
      };
    }
    
    function navigateLightbox(direction) {
      var media = window._lightboxMedia || [];
      if (media.length <= 1) return;
      var idx = window._lightboxIndex || 0;
      idx += direction;
      if (idx < 0) idx = media.length - 1;
      if (idx >= media.length) idx = 0;
      window._lightboxIndex = idx;
      renderLightbox();
    }
    
    function closeLightbox() {
      var overlay = document.getElementById('lightbox-overlay');
      if (overlay) document.body.removeChild(overlay);
      document.onkeydown = null;
      window._lightboxLastTap = 0;
    }

    async function toggleApproval(id) {
      try {
        await fetch(API_BASE + '/api/media/' + id, { method: 'PATCH', headers: { authorization: 'Bearer ' + adminState.password } });
        refreshAdmin();
      } catch(e) {}
    }

    async function deleteMedia(id) {
      if (!confirm('Delete this photo permanently?')) return;
      try {
        await fetch(API_BASE + '/api/media/' + id, { method: 'DELETE' });
        refreshAdmin();
      } catch(e) {}
    }

    // ===== Init =====
    window.addEventListener('hashchange', router);
    router();
    
    // Clean up intervals on page change
    window.addEventListener('hashchange', function() {
      if (slideshowState.interval) {
        clearInterval(slideshowState.interval);
        slideshowState.interval = null;
      }
      if (slideshowState.advanceTimer) {
        clearInterval(slideshowState.advanceTimer);
        slideshowState.advanceTimer = null;
      }
    });
  </script>
</body>
</html>
